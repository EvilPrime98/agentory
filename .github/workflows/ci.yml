name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # The git-based tests commit in scratch repos; runners have no git identity.
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@localhost
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@localhost

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      # Checkout must keep LF: a test asserts an embedded prompt has no CR.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    # The package list below is unverified, and the PTY/hook code is only exercised on Windows.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libasound2-dev libssl-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --workspace
